  <audio id="slideSound" type="audio" src="src/sound/slideSound.wav"></audio>

  <div id="menuBar">
    <button class="slideButton" style="width: 50px; height: 50px; margin: 3px auto 3px 10px;"
      onclick="settingPopup()"><svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-gear"></use></svg></button>
    <h1>3072</h1>
    <button class="slideButton" style="width: 50px; height: 50px; margin: 3px 10px 3px auto" onclick="questionGame()"><svg class="icon" viewBox="0 0 320 512" aria-hidden="true"><use href="#icon-question"></use></svg></button>
  </div>
  <div id="orderTable">
    <button id="resetButton" class="slideButton" style="width: 50px; height: 50px;"
      onclick="setGame()"><svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-rotate"></use></svg></button>
  </div>
  <div id="scoreBox">
    <h2>SCORE</h2>
    <h3 id="score"></h3>
  </div><br>
  <div id=board></div>
  <div id=buttonTable>
    <button id="qKey" class="slideButton" style="margin-left: 0;" onclick="silde(81)"> Q </button>
    <button id="wKey" class="slideButton" onclick="silde(87)"> W </button>
    <button id="eKey" class="slideButton" style="margin-right: 0;" onclick="silde(69)"> E </button>
    <button id="aKey" class="slideButton" style="margin-left: 0;" onclick="silde(65)"> A </button>
    <button id="sKey" class="slideButton" onclick="silde(83)"> S </button>
    <button id="dKey" class="slideButton" style="margin-right: 0;" onclick="silde(68)"> D </button>
  </div>

  <div id="gameOverPopup" class="background">
    <div class="window">
      <div class="popup">
        <div style="display: flex;">
          <button class="slideButton closeButton" onclick="closePopup()"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true"><use href="#icon-xmark"></use></svg></button><br>
        </div><br>
        <h2 class="popupTitle" style="font-size: 36px;">GameOver!</h2>
        <h2>Score : <div id="endScore" style="display: inline;"></div></h2>
          <h2>Max tiles : <div id="maxTiles" style="display: inline;"></div>
          </h2>
          <div class="popupButtonTable">
            <button class="slideButton" onclick="setGame()"> <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-rotate"></use></svg> </button>
            <button class="slideButton" onclick="sharing()"> <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-share"></use></svg> </button>
          </div>
      </div>
    </div>
  </div>

  <div id="questionPopup" class="background">
    <div class="window">
      <div class="popupQuestion">
        <div style="display: flex;">
          <button class="slideButton closeButton" onclick="closePopupQuestion()"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true"><use href="#icon-xmark"></use></svg></button><br>
        </div>
        <div class="questionSet">

          <div class="questionTileSet">
            <div class="questionKey"><h2>Q</h2></div>
            <div class="tileExample">
              <div class="tD t3D">
                <div class="textD">3</div>
              </div>
              <div class="tU"></div>
            </div>
            <div class="questionKey" style="font-size: 32px;"><h2>↖</h2></div>
            <div class="tileExample">
              <div class="tD"></div>
              <div class="tU t3U">
                <div class="textU">3</div>
              </div>
            </div>
          </div>

          <div class="questionTileSet">
            <div class="questionKey"><h2>W</h2></div>
            <div class="tileExample">
              <div class="tileLess"></div>
              <div class="tU t3U">
                <div class="textU">3</div>
              </div>
              <div class="tileLess"></div>
              <div class="tileLess"></div>
              <div class="tD"></div>
              <div class="tileLess"></div>
            </div>
            <div class="questionKey"><h2 style="font-size: 40px;">↑</h2></div>
            <div class="tileExample">
              <div class="tileLess"></div>
              <div class="tU"></div>
              <div class="tileLess"></div>
              <div class="tileLess"></div>
              <div class="tD t3D">
                <div class="textD">3</div>
              </div>
              <div class="tileLess"></div>
            </div>
          </div>

          <div class="questionTileSet">
            <div class="questionKey"><h2>E</h2></div>
            <div class="tileExample">
              <div class="tU"></div>
              <div class="tD t3D">
                <div class="textD">3</div>
              </div>
            </div>
            <div class="questionKey" style="font-size: 32px;"><h2>↗</h2></div>
            <div class="tileExample">
              <div class="tU t3U">
                <div class="textU">3</div>
              </div>
              <div class="tD"></div>
            </div>
          </div>

          <hr>

          <div class="questionTileSet">
            <div class="tileExample">
              <div class="tU"></div>
              <div class="tD t3D">
                <div class="textD">3</div>
              </div>
            </div>
            <div class="questionKey" style="font-size: 32px;"><h2>↙</h2></div>
            <div class="tileExample">
              <div class="tU t3U">
                <div class="textU">3</div>
              </div>
              <div class="tD"></div>
            </div>
            <div class="questionKey" style="margin-top: 10px;"><h2>A</h2></div>
          </div>

          <div class="questionTileSet">
            <div class="tileExample">
              <div class="tileLess"></div>
              <div class="tU t3U">
                <div class="textU">3</div>
              </div>
              <div class="tileLess"></div>
              <div class="tileLess"></div>
              <div class="tD"></div>
              <div class="tileLess"></div>
            </div>
            <div class="questionKey"><h2 style="font-size: 40px;">↓</h2></div>
            <div class="tileExample">
              <div class="tileLess"></div>
              <div class="tU"></div>
              <div class="tileLess"></div>
              <div class="tileLess"></div>
              <div class="tD t3D">
                <div class="textD">3</div>
              </div>
              <div class="tileLess"></div>
            </div>
            <div class="questionKey" style="margin-top: 10px;"><h2>S</h2></div>
          </div>

          <div class="questionTileSet">
            <div class="tileExample">
              <div class="tD t3D">
                <div class="textD">3</div>
              </div>
              <div class="tU"></div>
            </div>
            <div class="questionKey" style="font-size: 32px;"><h2>↘</h2></div>
            <div class="tileExample">
              <div class="tD"></div>
              <div class="tU t3U">
                <div class="textU">3</div>
              </div>
            </div>
            <div class="questionKey" style="margin-top: 10px;"><h2>D</h2></div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <div id="settingPopup" class="background">
    <div class="window">
      <div class="popup" style="display: flex; flex-wrap: wrap;">
        <div style="font-size: 36px; width: 102px; height: 24px; margin: 11px 69px;"><h2>Setting</h2></div>
        <hr style="margin: 10px 0;">
        <div class="menuBlock"><h2>HARD MODE</h2>
          <div style="margin: 1px auto 5px auto; border-radius: 30px;" onclick="checkHardMode()">
            <label class="toggleSwitch">
              <span class="toggleButton"></span>
            </label>
          </div>

        </div>
        <div class="menuBlock"><h2>DARK MODE</h2>
          <div style="margin: 1px auto 5px auto; border-radius: 30px;" onclick="checkDarkMode()">
            <label class="toggleSwitch darkMode">
              <span class="toggleButton"></span>
            </label>
          </div>

        </div>
        <div style="display: flex; flex-wrap: wrap; width: 280px; margin-bottom: 16px;">
          <button class="slideButton"
            style="width: 50px; height:50px; border-radius:50%; margin: 0; margin-left: 15px; margin-right: auto; "
            onclick="openRepositories()"><svg class="icon" viewBox="0 0 496 512" aria-hidden="true"><use href="#icon-github"></use></svg></button>
          <button class="slideButton"
            style="width: 50px; height:50px; border-radius:50%; margin: 0; margin-left: auto; margin-right: auto; "
            onclick="openTwitter()"><svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-twitter"></use></svg></button>
          <button class="slideButton"
            style="width: 50px; height:50px; border-radius:50%; margin: 0; margin-left: auto; margin-right: 15px; "
            onclick="sharing()"><svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-share"></use></svg></button>
        </div>
        <button class="slideButton" onclick="closePopupSetting()"><svg class="icon" viewBox="0 0 448 512" aria-hidden="true"><use href="#icon-check"></use></svg></button><br>
      </div>
    </div>
  </div>

  <div id="gameWinPopup" class="background">
    <div class="window">
      <div class="popup">
        <div style="display: flex;">
          <button class="slideButton closeButton" onclick="closeWinPopup()"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true"><use href="#icon-xmark"></use></svg></button><br>
        </div><br>
        <h2 class="popupTitle" style="font-size: 36px;">Game Win!</h2>
        <h2 style="margin-bottom: 64px;">Score : <div id="winScore" style="display: inline;"></div></h2>
        <div class="popupButtonTable">
          <button class="slideButton" onclick="setGame()"> <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-rotate"></use></svg> </button>
          <button class="slideButton" onclick="sharingWin()"> <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#icon-share"></use></svg> </button>
        </div>
      </div>
    </div>
  </div>


  
  <script src="src/game.js" type="text/javascript"></script>
  <script>device_checking()</script>
</body>

</html>
